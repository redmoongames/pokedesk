name: Public source contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check public contracts without game resources
        run: python -B tools/public_checks.py
      - name: Export and independently verify source
        run: |
          python -B tools/export_source.py --output "$RUNNER_TEMP/pokedesk-source"
          python -B tools/export_source.py --check "$RUNNER_TEMP/pokedesk-source"
      - name: Build packages from a disposable copy
        run: |
          python -m pip install build
          cp -R "$RUNNER_TEMP/pokedesk-source" "$RUNNER_TEMP/build-input"
          python -m build "$RUNNER_TEMP/build-input" --outdir "$RUNNER_TEMP/packages"
      - name: Verify archive contents against unchanged source
        run: |
          for artifact in "$RUNNER_TEMP"/packages/*; do
            python -B tools/export_source.py --project "$RUNNER_TEMP/pokedesk-source" --check-artifact "$artifact"
          done
