name: Publish reviewed source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and unpack the reviewed source archive
        env:
          EXPECTED_ARCHIVE_SHA256: 4d0c3140f2327113410c88e447d94776add263ebb71a1317180683387b218d13
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, shutil, subprocess, sys, tempfile, zipfile
          archive=Path('source-upload.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['EXPECTED_ARCHIVE_SHA256'], 'Wrong source archive'
          with zipfile.ZipFile(archive) as bundle, tempfile.TemporaryDirectory() as temporary:
              infos=bundle.infolist(); names=[item.filename for item in infos]
              assert len(names)==len(set(names)) and len(names)<500, 'Invalid archive entries'
              manifest=json.loads(bundle.read('SOURCE_EXPORT.json'))
              expected={row['path']:row for row in manifest['files']}
              assert set(names)==set(expected)|{'SOURCE_EXPORT.json'}, 'Unlisted archive content'
              root=Path(temporary)
              for item in infos:
                  name=item.filename; relative=PurePosixPath(name)
                  assert not relative.is_absolute() and all(p not in ('','.','..','.git') for p in relative.parts)
                  assert item.file_size<=2*1024*1024 and not item.is_dir()
                  data=bundle.read(item)
                  if name in expected:
                      assert len(data)==expected[name]['bytes'] and hashlib.sha256(data).hexdigest()==expected[name]['sha256']
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              subprocess.run([sys.executable,'-B',str(root/'tools/export_source.py'),'--check',str(root)],check=True)
              subprocess.run([sys.executable,'-B',str(root/'tools/public_checks.py')],cwd=root,check=True)
              for name in names:
                  if name.startswith('.github/workflows/'):continue
                  target=Path(name);target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(root/name,target)
          PYTHON
      - name: Commit reviewed source and remove the upload archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch source-upload.zip
          git add --all
          git commit -m "Publish PokéDesk source preview and documentation"
          git push origin "HEAD:$GITHUB_REF_NAME"
